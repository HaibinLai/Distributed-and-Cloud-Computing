# https://docs.docker.com/reference/compose-file/
services:
  # database for persistant data storage
  postgres:
    # https://hub.docker.com/_/postgres
    image: postgres:17
    container_name: postgres
    hostname: postgres
    environment:
      POSTGRES_USER: dncc
      POSTGRES_PASSWORD: dncc
      POSTGRES_DB: goodsstore
    ports:
      - "5432:5432" # Expose PostgreSQL to localhost ("local:container")
    volumes:
      - pg_data:/var/lib/postgresql/data # default PGDATA location: /var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d # init run all scripts by default in: /docker-entrypoint-initdb.d

  # kafka message queue with zookeeper config management
  zookeeper:
    # https://hub.docker.com/r/confluentinc/cp-zookeeper
    image: confluentinc/cp-zookeeper:7.7.1
    container_name: zookeeper
    hostname: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    # monitor whether zookeeper is ready
    healthcheck:
      test: ["CMD", "sh", "-c", "echo > /dev/tcp/zookeeper/2181"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 1s

  kafka:
    # https://hub.docker.com/r/confluentinc/cp-kafka
    image: confluentinc/cp-kafka:7.7.1
    container_name: kafka
    hostname: kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:9092,OUTSIDE://localhost:9092
      KAFKA_LISTENERS: INSIDE://0.0.0.0:9092,OUTSIDE://0.0.0.0:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    # Restart policy moved to service top-level (Compose v1 expects restart values like 'no', 'on-failure', 'unless-stopped', 'always')
    restart: unless-stopped
    ports:
      - "9092:9092" # For internal Docker use
      - "9093:9093" # For external access
    # monitor whether kafka is ready
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          "echo > /dev/tcp/kafka/9092 && echo > /dev/tcp/kafka/9093",
        ]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 3s

  kafka-topic-creator:
    image: confluentinc/cp-kafka:7.7.1
    depends_on:
      - kafka
    # This helper should not restart automatically after it finishes
    restart: "no"
    entrypoint: >
      bash -c "
      /bin/kafka-topics --create --topic log-channel --bootstrap-server kafka:9092 --partitions 1 --replication-factor 1;
      "

  ##### YOUR SERVICES GO BELOW THIS LINE #####

  # db_service:
  #   build: ./src/db_service      # 根据你的真实路径改
  #   container_name: db_service
  #   depends_on:
  #     - postgres
  #   environment:
  #     POSTGRES_DSN: "dbname=goodsstore user=dncc password=dncc host=postgres port=5432"

  api_service:
      build: ./src/api_service/server/python-flask/  # 你 Flask 代码所在目录
      container_name: api_service
      depends_on:
        # - db_service
        - logging_service
      environment:
        # DB_ADDR: "db_service:50051"
        LOGGING_ADDR: "logging_service:50052"
      ports:
        - "8080:8080"   # 把 API 暴露给外面 (curl 打这个端口)
      # 启动


  logging_service:
    build:
      context: ./src/logging_service
      dockerfile: Dockerfile
    container_name: logging_service
    hostname: logging_service
    depends_on:
      - kafka
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC=api-logs
    # gRPC 只在内部用，可以不映射到宿主机
    ports:
      - "50052:50052"
    networks:
      - default

volumes:
  pg_data: # A placeholder volume without any configuration
