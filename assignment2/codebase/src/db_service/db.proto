syntax = "proto3";
package db;

message Empty {}

message ProductId { int32 id = 1; }
message UserId    { int32 id = 1; }
message OrderId   { int32 id = 1; }

message Product {
  int32 id = 1;
  string name = 2;
  string category = 3;
  float price = 4;
  int32 stock = 5;
}

message ListProductsResp { repeated Product products = 1; }

message CreateUserReq { string username = 1; string password_hash = 2; }
message User {
  int32 id = 1;
  string username = 2;
  bool active = 3;
  // 不返回 password_hash 给 API
}
message GetUserByNameReq { string username = 1; }

message UpdateUserReq { int32 id = 1; string username = 2; }
message DeactivateUserReq { int32 id = 1; }

message PlaceOrderReq {
  int32 user_id = 1;
  int32 product_id = 2;
  int32 quantity = 3; // <=3
}
enum OrderStatus { PLACED = 0; CANCELED = 1; }
message Order {
  int32 id = 1;
  int32 user_id = 2;
  int32 product_id = 3;
  int32 quantity = 4;
  float total_price = 5;
  OrderStatus status = 6;
}

service DbService {
  rpc ListProducts(Empty) returns (ListProductsResp);
  rpc GetProduct(ProductId) returns (Product);

  rpc CreateUser(CreateUserReq) returns (User);
  rpc GetUser(UserId) returns (User);
  rpc GetUserByName(GetUserByNameReq) returns (User); // 用于登录
  rpc UpdateUser(UpdateUserReq) returns (User);
  rpc DeactivateUser(DeactivateUserReq) returns (User);

  rpc PlaceOrder(PlaceOrderReq) returns (Order);
  rpc GetOrder(OrderId) returns (Order);
  rpc CancelOrder(OrderId) returns (Order);
}
